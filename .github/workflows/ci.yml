name: Verify AyurTech
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test && pnpm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: ayurtech
          POSTGRES_DB: ayurtech_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ayurtech -d ayurtech_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ayurtech:test@localhost:5432/ayurtech_test
      TEST_DATABASES: both
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: alembic upgrade head && alembic check && python -m app.seed
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - run: docker compose -p ayurtech-verify -f compose.verify.yaml up --build --abort-on-container-exit --exit-code-from verify
      - run: docker compose -p ayurtech-e2e --env-file .env.example -f compose.yaml -f compose.e2e.yaml up -d --build
      - run: python scripts/verify_http.py --docker-checks
      - if: always()
        run: |
          docker compose -p ayurtech-verify -f compose.verify.yaml down
          docker compose -p ayurtech-e2e --env-file .env.example -f compose.yaml -f compose.e2e.yaml down -v
