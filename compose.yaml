services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ayurtech
      POSTGRES_USER: ayurtech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ayurtech -d ayurtech]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://ayurtech:${POSTGRES_PASSWORD}@db:5432/ayurtech
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
